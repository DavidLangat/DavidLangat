name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: username=${{ github.repository_owner }}&hide_border=true&bg_color=00000000
      STATS: show_icons=true&include_all_commits=true&count_private=true
      LANGS: layout=compact&langs_count=6
    steps:
      - uses: actions/checkout@v4

      # GRS_TOKEN is an optional personal access token (repo, read:user) so
      # private-repo activity is counted; without it only public stats show.
      - name: Stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.BASE }}&${{ env.STATS }}&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.BASE }}&${{ env.STATS }}&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: ${{ env.BASE }}&${{ env.LANGS }}&theme=default
          path: profile/top-langs-light.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: ${{ env.BASE }}&${{ env.LANGS }}&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
